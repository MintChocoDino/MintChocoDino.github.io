<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found — Nathanial Hodnett</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Root-relative on purpose: a 404 can be served at any depth, so a relative path
     would resolve against the missing URL. The site is a user page at the domain
     root (mintchocodino.github.io), NOT a project page under /LandingPage/. -->
<link rel="stylesheet" href="/assets/css/site.css">
<style>
  .nf { min-height: 82vh; display: grid; place-items: center; text-align: center; }
  .nf h1 { font-size: clamp(3.5rem, 14vw, 7rem); letter-spacing: -.05em; }
  .nf p { color: var(--fg-muted); margin: 14px 0 28px; }
</style>
</head>
<body>
  <div class="nf">
    <div class="wrap">
      <div class="mono" style="color:var(--accent);margin-bottom:12px">Error</div>
      <h1>404</h1>
      <p>That page does not exist.</p>
      <a class="btn btn--accent" href="/">Back to the portfolio</a>
    </div>
  </div>
</body>
</html>
