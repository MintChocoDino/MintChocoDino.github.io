<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found — Nathanial Hodnett</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#221A15">
<link rel="icon" href="/assets/img/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=JetBrains+Mono:wght@400;500&display=swap">
<!-- Root-relative on purpose: a 404 can be served at any depth, so a relative path
     would resolve against the missing URL. The site is a user page at the domain
     root (mintchocodino.github.io), NOT a project page under /LandingPage/. -->
<link rel="stylesheet" href="/assets/css/site.css">
<style>
  .nf { min-height: 82vh; display: grid; place-items: center; text-align: center; }
  .nf h1 { font-size: clamp(3.5rem, 14vw, 7rem); letter-spacing: -.05em; }
  .nf p { color: var(--fg-muted); margin: 14px 0 28px; }
  /* The mark gets room to be itself here — it is the one page with nothing else
     to say. Masked rather than <img> so it takes the accent colour. */
  .nf__mark {
    width: clamp(120px, 26vw, 190px);
    aspect-ratio: 120 / 74;
    margin: 0 auto 26px;
    background: var(--accent);
    opacity: .85;
    -webkit-mask: url("/assets/img/brand/dino.svg") center / contain no-repeat;
            mask: url("/assets/img/brand/dino.svg") center / contain no-repeat;
  }
</style>
</head>
<body>
  <div class="nf">
    <div class="wrap">
      <div class="nf__mark" aria-hidden="true"></div>
      <div class="mono" style="color:var(--accent);margin-bottom:12px">Error</div>
      <h1>404</h1>
      <p>That page does not exist.</p>
      <a class="btn btn--accent" href="/">Back to the portfolio</a>
    </div>
  </div>
</body>
</html>
